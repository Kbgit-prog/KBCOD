<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KB COD Manager</title>
    <script>
      // La clé API (client_id) de l'app est dans l'URL : /app/<client_id>. Elle est publique.
      (function () {
        var parts = location.pathname.split("/");
        var key = parts[1] === "app" && parts[2] ? parts[2] : "";
        window.__KBCOD_API_KEY__ = key;
        if (key) {
          document.write('<meta name="shopify-api-key" content="' + key.replace(/[^a-zA-Z0-9_-]/g, "") + '" />');
          document.write('<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"><\/script>');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
